name: Quality
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 -m unittest discover -s tests/deploy -v
      - name: Ensure FFmpeg tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout=20
            sudo apt-get install -y ffmpeg
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
      - name: Package verified release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm ci --omit=dev
          tar --dereference -czf /tmp/shorts-release.tgz dist src node_modules package.json package-lock.json LICENSE
          printf '%s' "$GITHUB_SHA" > /tmp/release-sha
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-${{ github.sha }}
          path: |
            /tmp/shorts-release.tgz
            /tmp/release-sha
